name: Weekly Design Job Digest

on:
  schedule:
    - cron: "0 14 * * 1"   # Every Monday at 9 AM CST (14:00 UTC)
  workflow_dispatch:         # Also lets you run it manually from GitHub
    inputs:
      to_email:
        description: "Send to this address instead of the default (leave blank for default)"
        required: false
      region:
        description: "Location filter"
        type: choice
        options: [west-coast, bay-area]
        default: west-coast

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TO_EMAIL: ${{ inputs.to_email }}
          REGION: ${{ inputs.region }}
        run: python scraper.py
