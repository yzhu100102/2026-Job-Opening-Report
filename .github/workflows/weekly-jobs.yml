name: Daily Design Job Digest

on:
  schedule:
    # GitHub cron is UTC-only. These slots cover the daylight and standard-time UTC
    # equivalents of each send time in use; schedule_gate.py lets through only the one
    # matching the SEND_TIME / SEND_TZ / SEND_DAYS repo variables (default: 9:00 AM
    # Central, every day). Using a new send time? Add its two UTC slots here.
    - cron: "0 14 * * *"    # 9:00 AM Central (daylight)
    - cron: "0 15 * * *"    # 9:00 AM Central (standard)
    - cron: "30 13 * * *"   # 6:30 AM Pacific (daylight)
    - cron: "30 14 * * *"   # 6:30 AM Pacific (standard)
  workflow_dispatch:         # Also lets you run it manually from GitHub
    inputs:
      to_email:
        description: "Send to this address instead of the default (leave blank for default)"
        required: false
      region:
        description: "Location filter (default = the REGION repo variable)"
        type: choice
        options: [default, west-coast, bay-area]
        default: default

# Lets the workflow save seen_jobs.json to the seen-jobs branch
permissions:
  contents: write

# Don't let two runs update seen_jobs.json at the same time
concurrency: job-digest

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check send time
        id: gate
        env:
          CRON: ${{ github.event.schedule }}
          SEND_TIME: ${{ vars.SEND_TIME }}
          SEND_TZ: ${{ vars.SEND_TZ }}
          SEND_DAYS: ${{ vars.SEND_DAYS }}
        run: python3 schedule_gate.py

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests

      # Already-reported jobs live on a separate seen-jobs branch so main stays code-only
      # (and each repo that runs this keeps its own history)
      - name: Load seen jobs
        if: steps.gate.outputs.run == 'true'
        run: |
          if git fetch --depth=1 origin seen-jobs 2>/dev/null; then
            git show FETCH_HEAD:seen_jobs.json > seen_jobs.json
          else
            echo "No seen-jobs branch yet — first run reports every matching job"
          fi

      - name: Run scraper
        if: steps.gate.outputs.run == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Recipient and region come from repo variables (Settings → Secrets and
          # variables → Actions → Variables); manual runs can override them.
          TO_EMAIL: ${{ inputs.to_email || vars.TO_EMAIL }}
          REGION: ${{ (inputs.region != 'default' && inputs.region) || vars.REGION }}
          # A manual run to a different address is a one-off test: report every
          # matching job and leave seen_jobs.json alone
          IGNORE_SEEN: ${{ inputs.to_email != '' && inputs.to_email != null }}
        run: |
          if [ "$IGNORE_SEEN" = "true" ]; then
            python scraper.py --ignore-seen
          else
            python scraper.py
          fi

      - name: Save seen jobs
        if: steps.gate.outputs.run == 'true'
        run: |
          [ -f seen_jobs.json ] || exit 0
          mv seen_jobs.json "$RUNNER_TEMP/seen_jobs.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin seen-jobs 2>/dev/null; then
            git checkout -q -B seen-jobs FETCH_HEAD
          else
            git checkout -q --orphan seen-jobs
            git rm -rq --cached .
          fi
          cp "$RUNNER_TEMP/seen_jobs.json" seen_jobs.json
          git add seen_jobs.json
          git diff --cached --quiet && exit 0
          git commit -qm "Update seen jobs"
          git push origin seen-jobs
